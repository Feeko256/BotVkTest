name: Notify VK Teams

on:
  push:
    branches:
      - main  # Если ваша главная ветку называется master, замените main на master

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send VK Teams notification
        env:
          # Собираем данные о коммите
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
        run: |
          curl --fail --insecure \
            "https://api.vkteams.bspb.ru/bot/v1/messages/sendText{{ secrets.VK_TEAMS_BOT_TOKEN }}&chatId=${{ secrets.VK_TEAMS_CHAT_ID }}" \
            --data-urlencode "text=Новый коммит от ${COMMIT_AUTHOR}:%0A${COMMIT_MSG}%0A%0AСсылка:%0A${COMMIT_URL}"
