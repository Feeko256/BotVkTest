name: Notify VK Teams

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Message Text
        id: msg
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          # Сохраняем массивы файлов как чистый текст
          ADDED_FILES: ${{ toJson(github.event.head_commit.added) }}
          REMOVED_FILES: ${{ toJson(github.event.head_commit.removed) }}
          MODIFIED_FILES: ${{ toJson(github.event.head_commit.modified) }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.event.head_commit.id }}
          REPO: ${{ github.repository }}
        run: |
          # Используем безопасный синтаксис "<<<" для передачи JSON в jq
          ADDED=$(jq -r 'if . == null or length == 0 then "нет" else join(", ") end' <<< "$ADDED_FILES")
          REMOVED=$(jq -r 'if . == null or length == 0 then "нет" else join(", ") end' <<< "$REMOVED_FILES")
          MODIFIED=$(jq -r 'if . == null or length == 0 then "нет" else join(", ") end' <<< "$MODIFIED_FILES")
          
          # Запрашиваем статистику строк и проверяем, что ответ от API валиден
          STATS_RESPONSE=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://github.com")
          
          # Проверяем, вернул ли GitHub валидный JSON со статистикой
          if echo "$STATS_RESPONSE" | jq -e '.stats' >/dev/null 2>&1; then
            LINES_ADDED=$(echo "$STATS_RESPONSE" | jq -r '.stats.additions // 0')
            LINES_DELETED=$(echo "$STATS_RESPONSE" | jq -r '.stats.deletions // 0')
          else
            LINES_ADDED=0
            LINES_DELETED=0
          fi
          
          # Формируем итоговый многострочный текст
          echo "TEXT_DATA<<EOF" >> $GITHUB_ENV
          echo "💻 Новый коммит от ${COMMIT_AUTHOR}:" >> $GITHUB_ENV
          echo "${COMMIT_MSG}" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "📊 Статистика изменений:" >> $GITHUB_ENV
          echo "➕ Добавлено строк: $LINES_ADDED" >> $GITHUB_ENV
          echo "➖ Удалено строк: $LINES_DELETED" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "📂 Файлы:" >> $GITHUB_ENV
          echo "🆕 Добавлены: $ADDED" >> $GITHUB_ENV
          echo "📝 Обновлены: $MODIFIED" >> $GITHUB_ENV
          echo "🗑 Удалены: $REMOVED" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "Ссылка:" >> $GITHUB_ENV
          echo "${COMMIT_URL}" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Send VK Teams notification
        env:
          BOT_TOKEN: ${{ secrets.VK_TEAMS_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.VK_TEAMS_CHAT_ID }}
        run: >
          curl --silent --show-error --insecure --max-time 15 -G -X POST
          "https://api.vkteams.bspb.ru/bot/v1/messages/sendText"
          --data-urlencode "token=${BOT_TOKEN}"
          --data-urlencode "chatId=${CHAT_ID}"
          --data-urlencode "text=${{ env.TEXT_DATA }}"
