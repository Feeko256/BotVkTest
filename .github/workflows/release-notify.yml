name: Notify VK Teams

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Message Text
        id: msg
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          # Передаем списки файлов из контекста события push
          ADDED_FILES: ${{ toJson(github.event.head_commit.added) }}
          REMOVED_FILES: ${{ toJson(github.event.head_commit.removed) }}
          MODIFIED_FILES: ${{ toJson(github.event.head_commit.modified) }}
          # Токен для запроса статистики строк из GitHub API
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.event.head_commit.id }}
          REPO: ${{ github.repository }}
        run: |
          # 1. Форматируем списки файлов в читаемый вид с помощью jq
          ADDED=$(echo '$ADDED_FILES' | jq -r 'if . == null or length == 0 then "нет" else join(", ") end')
          REMOVED=$(echo '$REMOVED_FILES' | jq -r 'if . == null or length == 0 then "нет" else join(", ") end')
          MODIFIED=$(echo '$MODIFIED_FILES' | jq -r 'if . == null or length == 0 then "нет" else join(", ") end')
          
          # 2. Запрашиваем количество измененных строк через GitHub API
          STATS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://github.com" | jq '.stats')
          LINES_ADDED=$(echo "$STATS" | jq -r '.additions // 0')
          LINES_DELETED=$(echo "$STATS" | jq -r '.deletions // 0')
          
          # 3. Собираем многострочный текст для VK Teams
          echo "TEXT_DATA<<EOF" >> $GITHUB_ENV
          echo "💻 Новый коммит от ${COMMIT_AUTHOR}:" >> $GITHUB_ENV
          echo "${COMMIT_MSG}" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "📊 Статистика изменений:" >> $GITHUB_ENV
          echo "➕ Добавлено строк: $LINES_ADDED" >> $GITHUB_ENV
          echo "➖ Удалено строк: $LINES_DELETED" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "📂 Файлы:" >> $GITHUB_ENV
          echo "🆕 Добавлены: $ADDED" >> $GITHUB_ENV
          echo "📝 Обновлены: $MODIFIED" >> $GITHUB_ENV
          echo "🗑 Удалены: $REMOVED" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "Ссылка:" >> $GITHUB_ENV
          echo "${COMMIT_URL}" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Send VK Teams notification
        env:
          BOT_TOKEN: ${{ secrets.VK_TEAMS_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.VK_TEAMS_CHAT_ID }}
        run: >
          curl --silent --show-error --insecure --max-time 15 -G -X POST
          "https://api.vkteams.bspb.ru/bot/v1/messages/sendText"
          --data-urlencode "token=${BOT_TOKEN}"
          --data-urlencode "chatId=${CHAT_ID}"
          --data-urlencode "text=${{ env.TEXT_DATA }}"
